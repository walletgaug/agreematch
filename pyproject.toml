[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "walletgaug-agreematch"
version = "0.1.0"
description = "计算一致率与 Kappa，列出分歧最大的条目与分歧类型"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "walletgaug" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://walletgaug.github.io"
Repository = "https://github.com/walletgaug/agreematch"
Issues = "https://github.com/walletgaug/agreematch/issues"

[project.scripts]
agreematch = "agreematch:main"

[tool.setuptools]
py-modules = ["agreematch"]
